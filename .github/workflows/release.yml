name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact version tag, for example v0.1.0
        required: true
        type: string
      source_sha:
        description: Exact full 40-character source commit SHA
        required: true
        type: string
      notes_reviewed:
        description: Type REVIEWED after reviewing the versioned release notes
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to authorize GitHub Release creation
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate publication intent and source identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NOTES_REVIEWED: ${{ inputs.notes_reviewed }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python scripts/verify_release_candidate.py
          --release-tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --notes-reviewed "$NOTES_REVIEWED"
          --confirmation "$CONFIRMATION"
          --notes-file .github/releases/0.1.0.md
      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pip-audit
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Validate wheel and source distribution
        run: twine check dist/*
      - name: Install wheel and execute CLI acceptance smoke
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install --upgrade pip setuptools
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python -m pip check
          .release-wheel/bin/aegis --version
          .release-wheel/bin/aegis --help
          .release-wheel/bin/aegis run-all fixtures/providers --run-dir "$RUNNER_TEMP/aegis-release-run"
          .release-wheel/bin/aegis report --run-dir "$RUNNER_TEMP/aegis-release-run" --format json --output "$RUNNER_TEMP/aegis-release-run/report.json"
          .release-wheel/bin/aegis export csv --run-dir "$RUNNER_TEMP/aegis-release-run" --output "$RUNNER_TEMP/aegis-release-run/report.csv"
          .release-wheel/bin/aegis export html --run-dir "$RUNNER_TEMP/aegis-release-run" --output "$RUNNER_TEMP/aegis-release-run/report.html"
          .release-wheel/bin/aegis findings --run-dir "$RUNNER_TEMP/aegis-release-run" --limit 10
          .release-wheel/bin/aegis replay-export --findings "$RUNNER_TEMP/aegis-release-run/triaged.jsonl" --output "$RUNNER_TEMP/aegis-release-run/replay.json"
          .release-wheel/bin/aegis replay-validate "$RUNNER_TEMP/aegis-release-run/replay.json"
      - name: Install source distribution in a clean environment
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install --upgrade pip setuptools
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python -m pip check
          .release-sdist/bin/aegis --version
          .release-sdist/bin/aegis --help
      - name: Generate CycloneDX SBOM from clean wheel environment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -m pip install --target .release-sbom-site --no-compile dist/*.whl
          pip-audit \
            --path .release-sbom-site \
            --format cyclonedx-json \
            --output dist/aegis-v0.1.0-sbom.cdx.json
          python scripts/enrich_release_sbom.py \
            --sbom dist/aegis-v0.1.0-sbom.cdx.json \
            --wheel dist/*.whl \
            --site-packages .release-sbom-site \
            --source-sha "$SOURCE_SHA"
      - name: Create checksums and release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python scripts/create_release_manifest.py
          --artifact-dir dist
          --release-tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
      - name: Upload validated release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegis-release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aegis-release-bundle
          path: dist
      - name: Revalidate tag, source, checksum, and release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          NOTES_REVIEWED: ${{ inputs.notes_reviewed }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python scripts/verify_release_candidate.py --release-tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --notes-reviewed "$NOTES_REVIEWED" --confirmation "$CONFIRMATION" --notes-file .github/releases/0.1.0.md
          python scripts/create_release_manifest.py --artifact-dir dist --release-tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --verify-only
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.whl dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS dist/release_manifest.json
          --verify-tag --target "$SOURCE_SHA"
          --title "Aegis CLI $RELEASE_TAG"
          --notes-file .github/releases/0.1.0.md
